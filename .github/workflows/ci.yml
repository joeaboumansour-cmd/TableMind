name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The fast half of the harness, wired in by Phase 9.3 Branch A (KEEP).
      #
      # This runs on EVERY push because it can: 175 tests in 1.6s wall, pure
      # logic, no database, no network, no browser, and therefore NO SECRETS.
      # That is not an accident — harness/vitest.config.mts pins the
      # environment to `node` precisely so nothing in here can reach further.
      #
      # It is also the half that earns its keep: the money rules, the cart
      # lanes, the reconcile guard, the eviction order and the retry backoff
      # are all characterised here, and `npm run harness:mutation` has proven
      # 7/7 that it catches a real change.
      - name: Harness (unit)
        run: npm run harness:unit

      # Lint is advisory for now. It had been silently broken since the Next 16
      # upgrade (`next lint` was removed), so it surfaced ~134 pre-existing
      # errors the first time it ran. Burn those down, then drop this line so
      # lint failures block the build.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
