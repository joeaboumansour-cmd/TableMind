<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Testing Loop</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#14181d; --panel-2:#1a1f26; --line:#252c35;
    --fg:#e6eaf0; --dim:#8b97a8; --accent:#f0b429;
    --crit:#f43f5e; --high:#fb923c; --med:#facc15; --low:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;
         border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
  .live{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:12px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--low)}
  .dot.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.15)}
  .hint{margin-left:auto;color:var(--dim);font-size:12px}
  .board{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));
         gap:12px;padding:16px;align-items:start;overflow-x:auto}
  .lane{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        min-height:160px;display:flex;flex-direction:column}
  .lane.over{border-color:var(--accent);background:#171c22}
  .lane > h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
             margin:0;padding:11px 13px;border-bottom:1px solid var(--line);
             display:flex;justify-content:space-between;align-items:center}
  .count{background:var(--panel-2);border-radius:20px;padding:1px 8px;color:var(--fg);font-size:11px}
  .cards{padding:9px;display:flex;flex-direction:column;gap:9px}
  .card{background:var(--panel-2);border:1px solid var(--line);border-left-width:3px;
        border-radius:8px;padding:10px 11px;cursor:grab}
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.4}
  .card.critical{border-left-color:var(--crit)} .card.high{border-left-color:var(--high)}
  .card.medium{border-left-color:var(--med)}   .card.low{border-left-color:var(--low)}
  .title{font-weight:560;margin-bottom:6px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;color:var(--dim);font-size:11px;align-items:center}
  .tag{background:#0e1216;border:1px solid var(--line);border-radius:4px;padding:1px 6px}
  .id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .seen{color:var(--accent)}
  details{margin-top:8px}
  summary{color:var(--dim);font-size:11px;cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary:before{content:"› ";}
  details[open] summary:before{content:"⌄ ";}
  .body{margin-top:7px;font-size:12px;color:#c3ccd9;white-space:pre-wrap;word-break:break-word}
  .body b{color:var(--fg);font-weight:600}
  .empty{color:var(--dim);font-size:12px;padding:16px 13px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Testing Loop</h1>
  <div class="live"><span class="dot" id="dot"></span><span id="status">connecting…</span></div>
  <div class="hint">drag a bug into <b>Fix it</b> to hand it to a coder</div>
</header>
<div class="board" id="board"></div>

<script>
const LANES = [
  { key: "open",         label: "Found",       accepts: false },
  { key: "delegated",    label: "Fix it",      accepts: true  },
  { key: "fixing",       label: "Coder",       accepts: false },
  { key: "needs-verify", label: "Re-test",     accepts: false },
  { key: "closed",       label: "Locked",      accepts: false },
];
// Which lane a status is drawn in. Several statuses share a column so the
// board stays readable: verified is on its way to closed, reopened is back
// in the coder's hands.
// A status with no lane is not drawn at all. `wontfix` and `not-a-bug` are
// settled — the record survives so the fingerprint keeps the tester quiet, but
// the board is for work, and neither is work.
const LANE_OF = {
  open: "open",
  delegated: "delegated",
  fixing: "fixing", reopened: "fixing",
  "needs-verify": "needs-verify",
  verified: "closed", closed: "closed",
};
// You can send anything to Fix it, and park anything back as Found.
const DROPPABLE = { delegated: ["open", "reopened", "needs-verify"] };

const board = document.getElementById("board");
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function render(bugs) {
  board.innerHTML = "";
  for (const lane of LANES) {
    const mine = bugs.filter((b) => LANE_OF[b.status] === lane.key);
    const el = document.createElement("section");
    el.className = "lane";
    el.dataset.lane = lane.key;
    el.innerHTML =
      "<h2>" + lane.label + "<span class='count'>" + mine.length + "</span></h2>" +
      "<div class='cards'>" +
      (mine.length ? mine.map(card).join("") : "<div class='empty'>—</div>") +
      "</div>";
    if (lane.accepts) {
      el.addEventListener("dragover", (e) => { e.preventDefault(); el.classList.add("over"); });
      el.addEventListener("dragleave", () => el.classList.remove("over"));
      el.addEventListener("drop", async (e) => {
        e.preventDefault();
        el.classList.remove("over");
        const id = e.dataTransfer.getData("text/plain");
        const bug = bugs.find((b) => b.id === id);
        if (!bug || !(DROPPABLE[lane.key] || []).includes(bug.status)) return;
        await fetch("/api/move", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ id, to: lane.key }),
        });
      });
    }
    board.appendChild(el);
  }
  for (const c of board.querySelectorAll(".card")) {
    c.addEventListener("dragstart", (e) => {
      e.dataTransfer.setData("text/plain", c.dataset.id);
      c.classList.add("dragging");
    });
    c.addEventListener("dragend", () => c.classList.remove("dragging"));
  }
}

function card(b) {
  const detail = [
    b.observed && "<b>Observed</b>\n" + esc(b.observed),
    b.expected && "<b>Expected</b>\n" + esc(b.expected),
    b.invariant && "<b>Invariant</b>\n" + esc(b.invariant),
    b.repro && b.repro.length && "<b>Repro</b>\n" + b.repro.map((s, i) => (i + 1) + ". " + esc(s)).join("\n"),
  ].filter(Boolean).join("\n\n");

  return (
    "<article class='card " + esc(b.severity) + "' draggable='true' data-id='" + esc(b.id) + "'>" +
      "<div class='title'>" + esc(b.title) + "</div>" +
      "<div class='meta'>" +
        "<span class='id'>" + esc(b.id) + "</span>" +
        "<span class='tag'>" + esc(b.class) + "</span>" +
        (b.route ? "<span class='tag'>" + esc(b.route) + "</span>" : "") +
        (b.seenCount > 1 ? "<span class='seen'>seen " + b.seenCount + "×</span>" : "") +
      "</div>" +
      (detail ? "<details><summary>detail</summary><div class='body'>" + detail + "</div></details>" : "") +
    "</article>"
  );
}

const dot = document.getElementById("dot"), status = document.getElementById("status");
const es = new EventSource("/api/stream");
es.onopen = () => { dot.classList.add("on"); status.textContent = "live"; };
es.onerror = () => { dot.classList.remove("on"); status.textContent = "reconnecting…"; };
es.onmessage = (e) => render(JSON.parse(e.data));
</script>
</body>
</html>
