
<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator</title>
  <style>
    body { margin: 0; padding: 20px; background: #333; }
    .icon { margin: 10px; display: inline-block; }
    canvas { border: 1px solid #666; }
  </style>
</head>
<body>
  <h1>PWA Icon Generator</h1>
  <p>Right-click on each icon and save as PNG with the specified filename.</p>
  
  <div class="icon">
    <h3>72x72</h3>
    <canvas id="canvas72" width="72" height="72"></canvas>
  </div>
  
  <div class="icon">
    <h3>96x96</h3>
    <canvas id="canvas96" width="96" height="96"></canvas>
  </div>
  
  <div class="icon">
    <h3>128x128</h3>
    <canvas id="canvas128" width="128" height="128"></canvas>
  </div>
  
  <div class="icon">
    <h3>144x144</h3>
    <canvas id="canvas144" width="144" height="144"></canvas>
  </div>
  
  <div class="icon">
    <h3>152x152</h3>
    <canvas id="canvas152" width="152" height="152"></canvas>
  </div>
  
  <div class="icon">
    <h3>192x192</h3>
    <canvas id="canvas192" width="192" height="192"></canvas>
  </div>
  
  <div class="icon">
    <h3>384x384</h3>
    <canvas id="canvas384" width="384" height="384"></canvas>
  </div>
  
  <div class="icon">
    <h3>512x512</h3>
    <canvas id="canvas512" width="512" height="512"></canvas>
  </div>

  <script>
    const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#f59e0b" rx="64"/>
  <g fill="white">
    <!-- Squirrel body -->
    <ellipse cx="256" cy="280" rx="120" ry="140"/>
    <!-- Squirrel head -->
    <circle cx="256" cy="160" r="80"/>
    <!-- Left ear -->
    <ellipse cx="200" cy="100" rx="25" ry="40"/>
    <!-- Right ear -->
    <ellipse cx="312" cy="100" rx="25" ry="40"/>
    <!-- Tail -->
    <path d="M256 420 Q200 400 180 320 Q160 240 200 200 Q240 160 280 200 Q320 240 300 320 Q280 400 256 420"/>
    <!-- Left eye -->
    <circle cx="230" cy="150" r="15" fill="#0a0a0a"/>
    <!-- Right eye -->
    <circle cx="282" cy="150" r="15" fill="#0a0a0a"/>
    <!-- Nose -->
    <ellipse cx="256" cy="180" rx="12" ry="8" fill="#0a0a0a"/>
    <!-- Mouth -->
    <path d="M240 195 Q256 210 272 195" stroke="#0a0a0a" stroke-width="4" fill="none"/>
    <!-- Left whiskers -->
    <line x1="200" y1="175" x2="160" y2="170" stroke="#0a0a0a" stroke-width="2"/>
    <line x1="200" y1="185" x2="160" y2="190" stroke="#0a0a0a" stroke-width="2"/>
    <!-- Right whiskers -->
    <line x1="312" y1="175" x2="352" y2="170" stroke="#0a0a0a" stroke-width="2"/>
    <line x1="312" y1="185" x2="352" y2="190" stroke="#0a0a0a" stroke-width="2"/>
    <!-- Left paw -->
    <ellipse cx="180" cy="380" rx="30" ry="20"/>
    <!-- Right paw -->
    <ellipse cx="332" cy="380" rx="30" ry="20"/>
  </g>
</svg>`;
    
    const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
    
    sizes.forEach(size => {
      const canvas = document.getElementById('canvas' + size);
      const ctx = canvas.getContext('2d');
      
      const img = new Image();
      const svgBlob = new Blob([svgContent], {type: 'image/svg+xml;charset=utf-8'});
      const url = URL.createObjectURL(svgBlob);
      
      img.onload = function() {
        ctx.drawImage(img, 0, 0, size, size);
        URL.revokeObjectURL(url);
      };
      
      img.src = url;
    });
  </script>
</body>
</html>
