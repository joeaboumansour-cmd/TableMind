<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Golden Box Background -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="#F59E0B"/>
  <!-- Side Profile Squirrel -->
  <g fill="white">
    <!-- Body -->
    <ellipse cx="18" cy="22" rx="6" ry="7"/>
    <!-- Head -->
    <circle cx="24" cy="14" r="5"/>
    <!-- Snout -->
    <ellipse cx="28" cy="15" rx="3" ry="2.5"/>
    <!-- Ear -->
    <path d="M22 10 L24 6 L26 10 Z"/>
    <!-- Eye -->
    <circle cx="25" cy="13" r="1.2" fill="#FEF3C7"/>
    <!-- Front paws -->
    <ellipse cx="22" cy="20" rx="2" ry="3"/>
    <!-- Hind leg -->
    <ellipse cx="14" cy="24" rx="2.5" ry="4"/>
    <!-- Big curly tail -->
    <path d="M12 20 
             C 8 18, 6 14, 6 10 
             C 6 4, 10 2, 14 4 
             C 17 5, 18 8, 16 10 
             C 14 12, 11 10, 12 8 
             C 12 6, 14 6, 15 7
             C 16 8, 16 10, 14 12
             C 12 14, 10 16, 12 20 Z"/>
    <!-- Tail highlight detail -->
    <path d="M10 14 
             C 9 12, 9 8, 11 6 
             C 13 5, 14 6, 13 8 
             C 12 9, 11 8, 11 7" 
          fill="none" 
          stroke="white" 
          stroke-width="1.5"
          opacity="0.6"
          stroke-linecap="round"/>
  </g>
</svg>
