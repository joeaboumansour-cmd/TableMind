<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Golden Squirrel POS</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f59e0b">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .logo {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .status {
      font-size: 24px;
      margin-bottom: 20px;
    }
    .message {
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .action {
      display: inline-block;
      background: #f59e0b;
      color: #0a0a0a;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .action {
      display: inline-block;
      background: #f59e0b;
      color: #0a0a0a;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      width: 100%;
      max-width: 200px;
      box-sizing: border-box;
    }
    .action.secondary {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
    }
    .action:hover {
      background: #eab308;
    }
    .action.secondary:hover {
      background: #334155;
    }
    .note {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🐿️</div>
    <div class="status">Offline Mode</div>
    <div class="message">
      You are currently offline. Some features may be unavailable.
    </div>
    <div class="actions">
      <a href="/pos" class="action">Go to POS</a>
      <a href="javascript:location.reload()" class="action secondary">Retry</a>
    </div>
    <div class="note">
      POS transactions still work offline. History requires internet.
    </div>
  </div>
</body>
</html>
